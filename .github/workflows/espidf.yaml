name: ESP-IDF CI

on:
  workflow_call:
    inputs:
      target_path:
        type: string
        description: 'Path value to select a specific target in the matrix'
        required: false
        default: ''
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        version:
          - name: v53_build
            version_number: release-v5.3
            target: esp32c6
          - name: v54_build
            version_number: release-v5.4
            target: esp32c6
          - name: v55_build
            version_number: release-v5.5
            target: esp32c6
          - name: v60_build
            version_number: release-v6.0
            target: esp32c6
          - name: v61_build
            version_number: release-v6.1
            target: esp32c6
        path:
          - name: examples/espidf/host
          - name: examples/espidf/node
          - name: examples/espidf/promiscuous
          - name: examples/espidf/energy_detect

    steps:
      - uses: actions/checkout@v4.1.1
        if: ${{ !inputs.target_path || startsWith(matrix.path.name, inputs.target_path) }}

      - name: ESP-IDF Build
        if: ${{ !inputs.target_path || startsWith(matrix.path.name, inputs.target_path) }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.version.version_number }}
          target: ${{ matrix.version.target }}
          path: ${{ matrix.path.name }}
