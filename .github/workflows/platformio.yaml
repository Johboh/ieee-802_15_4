name: PlatformIO CI

on:
  workflow_call:
    inputs:
      target_path:
        type: string
        description: 'Path value to select a specific target in the matrix'
        required: false
        default: ''
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - path: examples/espidf/host/main/main.cpp
          - path: examples/espidf/node/main/main.cpp
          - path: examples/espidf/promiscuous/main/main.cpp
          - path: examples/espidf/energy_detect/main/main.cpp

    steps:
      - uses: actions/checkout@v4.1.1
        if: ${{ !inputs.target_path || matrix.target.path == inputs.target_path || startsWith(matrix.target.path, inputs.target_path) }}

      - uses: actions/cache@v3
        if: ${{ !inputs.target_path || matrix.target.path == inputs.target_path || startsWith(matrix.target.path, inputs.target_path) }}
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v4
        if: ${{ !inputs.target_path || matrix.target.path == inputs.target_path || startsWith(matrix.target.path, inputs.target_path) }}
        with:
          python-version: '3.12'

      - name: Install PlatformIO Core
        if: ${{ !inputs.target_path || matrix.target.path == inputs.target_path || startsWith(matrix.target.path, inputs.target_path) }}
        run: pip install --upgrade platformio

      - name: Build PlatformIO targets
        if: ${{ !inputs.target_path || matrix.target.path == inputs.target_path || startsWith(matrix.target.path, inputs.target_path) }}
        run: ${{ env.PLATFORMIO_CI_BASE_CMD }}
        env:
          PLATFORMIO_CI_BASE_CMD: pio ci --lib="." --board=esp32-c6-devkitc-1 --project-option="build_unflags=-std=gnu++11" --project-option="build_flags=-std=gnu++17" --project-option="platform=espressif32@6.10.0" --project-option="lib_ldf_mode=deep" --project-option="framework=espidf"
          PLATFORMIO_CI_SRC: ${{ matrix.target.path }}
